# GoReleaser cho hellopay — bản tập.
# Kiểm tra file này:      goreleaser check
# Build thử không phát hành: goreleaser release --clean --skip=publish,validate
# Phát hành thật:          git tag v0.1.2 && git push origin v0.1.2  (GitHub Actions tự chạy)
version: 2

project_name: hellopay

builds:
  - id: hellopay
    main: ./cmd/hellopay
    binary: hellopay
    env:
      - CGO_ENABLED=0 # binary tĩnh: chạy được trên mọi distro Linux, không cần thư viện hệ thống
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    # Không nhúng đường dẫn thư mục trên máy build vào binary. Thiếu cờ này thì
    # `strings` trên binary công khai lộ ra cây thư mục của máy dev / runner CI.
    flags: [-trimpath]
    # Đóng dấu thời gian theo commit thay vì giờ build, để build lại cùng một
    # commit ra file y hệt (cùng SHA256). Đó là cách chứng minh binary đến từ
    # đúng source đó.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w # bỏ bảng debug cho binary nhỏ hơn
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      # .CommitDate thay vì .Date: .Date là giờ build nên mỗi lần build một khác.
      - -X main.date={{ .CommitDate }}

archives:
  - id: hellopay
    formats: [tar.gz]
    # Tên file này là "hợp đồng" giữa 4 kênh phát hành: install.sh, install.ps1,
    # Homebrew và Scoop đều đoán URL theo đúng khuôn dưới đây. Đổi khuôn = phải sửa cả 4.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip] # Windows không có sẵn tar
    # mtime của các file phụ cũng vào thẳng hash của gói .zip/.tar.gz, và mtime
    # là giờ checkout của từng máy. Không ghim thì hai máy build cùng một commit
    # ra hai gói khác hash — mà chính hash gói mới là thứ Homebrew/Scoop/winget ghim.
    files:
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}" }
      - src: README.md
        info: { mtime: "{{ .CommitDate }}" }

checksum:
  name_template: checksums.txt # 1 file chứa SHA256 của mọi file còn lại

# Ký checksums.txt bằng cosign, không cần khoá riêng — danh tính lấy từ GitHub
# Actions (OIDC). Ký đúng 1 file này là đủ, vì nó đã chứa mã băm của mọi file khác.
# install.sh sẽ kiểm chữ ký này nếu máy người dùng có cosign.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

release:
  github:
    owner: hoanghuydev # ĐỔI: user/tổ chức GitHub của bạn
    name: hellopay
  draft: false # để true nếu muốn xem lại trước khi công bố
  # Tag có -rc / -beta thì tự đánh dấu là bản thử. BẮT BUỘC phải có: thiếu nó thì
  # GitHub coi bản RC là "latest", và install.sh (đọc /releases/latest) sẽ phát
  # bản RC cho toàn bộ người dùng.
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

# ─────────────────────────────────────────────────────────────────────────────
# Homebrew (macOS + Linux). Cần repo riêng tên "homebrew-tap" và một token
# có quyền ghi vào repo đó (secret TAP_GITHUB_TOKEN trong Actions).
# Repo "homebrew-tap" → Homebrew bỏ tiền tố "homebrew-" → người dùng gõ:
#   brew install hoanghuydev/tap/hellopay
# ─────────────────────────────────────────────────────────────────────────────
homebrew_casks:
  - name: hellopay
    repository:
      owner: hoanghuydev
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Thư mục trong repo tap để GoReleaser ghi file .rb vào.
    # "Casks" là mặc định của homebrew_casks, ghi rõ ra để khỏi phải đoán.
    directory: Casks
    # Bản prerelease thì không đẩy cask, không thì `brew upgrade` kéo cả RC về.
    skip_upload: auto
    homepage: https://github.com/hoanghuydev/hellopay
    description: A fake CLI for practising releases
    binaries: [hellopay]
    url:
      verified: "github.com/hoanghuydev/hellopay/"
    # Binary chưa được Apple ký/notarize thì macOS sẽ chặn. Hook này xoá cờ
    # "tải từ Internet" ngay sau khi cài. Đây là cách chữa cháy, không phải cách đúng
    # — cách đúng là ký bằng Developer ID + notarize (xem mục 6 của hướng dẫn).
    #
    # Cask này cài được cả trên Linux (Homebrew 6.0), nơi không có `xattr` và cũng
    # không có quarantine. Điều kiện phải kiểm bằng File.executable? — KHÔNG được
    # gọi thử `xattr -h`, vì `system_command` mặc định raise khi lệnh thất bại, nên
    # chính cái guard sẽ làm sập việc cài trên Linux (exit 127).
    # `must_succeed: false` để một lỗi xattr không huỷ cả lần cài.
    hooks:
      post:
        install: |
          if File.executable?("/usr/bin/xattr")
            system_command "/usr/bin/xattr",
                           args:         ["-dr", "com.apple.quarantine", "#{staged_path}/hellopay"],
                           must_succeed: false
          end

# ─────────────────────────────────────────────────────────────────────────────
# Scoop (Windows). Cần repo riêng tên "scoop-bucket".
# Tên bucket do người dùng tự đặt lúc `scoop bucket add <tên> <url>`.
# ─────────────────────────────────────────────────────────────────────────────
scoops:
  - name: hellopay
    repository:
      owner: hoanghuydev
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    # Thư mục trong repo bucket để GoReleaser ghi file .json vào.
    # Mặc định là gốc repo; đặt "bucket" cho khớp cấu trúc repo scoop-bucket.
    directory: bucket
    skip_upload: auto # bản prerelease thì không đẩy manifest
    homepage: https://github.com/hoanghuydev/hellopay
    description: A fake CLI for practising releases
    license: MIT
