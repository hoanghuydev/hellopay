name: Release

# Chỉ chạy khi có tag dạng v* được đẩy lên. Không tag = không phát hành.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # cần quyền này để tạo GitHub Release và upload file

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser cần toàn bộ history + tag để dựng changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Token này GitHub tự cấp, chỉ ghi được vào repo hiện tại.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token riêng để ghi sang repo homebrew-tap và scoop-bucket.
          # Tạo ở Settings → Developer settings → Personal access tokens,
          # rồi thêm vào repo này ở Settings → Secrets → Actions.
          # Chưa bật Homebrew/Scoop thì dòng này không cần.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  # GoReleaser chỉ sinh **cask** một cách chính thức. Job này lo phần **formula** —
  # thứ mà mục `brews` (đã deprecated) từng làm. Chạy sau khi release xong, vì nó
  # đọc checksums.txt từ chính bản phát hành vừa tạo.
  # Bỏ job này nếu bạn chọn đi đường cask.
  homebrew-formula:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: hoanghuydev/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Regenerate formula
        run: sh scripts/update-formula.sh "${GITHUB_REF_NAME}" tap/Formula/hellopay.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Không có gì thay đổi thì thoát êm, đừng để job đỏ vì một commit rỗng.
          git diff --quiet && { echo "formula already up to date"; exit 0; }
          git add Formula/hellopay.rb
          git commit -m "hellopay: ${GITHUB_REF_NAME}"
          git push
