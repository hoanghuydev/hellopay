name: Release

# Chỉ chạy khi có tag dạng v* được đẩy lên. Không tag = không phát hành.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # cần quyền này để tạo GitHub Release và upload file
  id-token: write # cosign ký không cần khoá, danh tính lấy qua OIDC

# Hai tag đẩy lên sát nhau sẽ tranh nhau ghi vào repo tap/bucket. Xếp hàng thay vì
# huỷ job cũ: một bản phát hành đang dở mà bị huỷ giữa đường thì tệ hơn là chờ.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser cần toàn bộ history + tag để dựng changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Token này GitHub tự cấp, chỉ ghi được vào repo hiện tại.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token riêng để ghi sang repo homebrew-tap và scoop-bucket.
          # Tạo ở Settings → Developer settings → Personal access tokens,
          # rồi thêm vào repo này ở Settings → Secrets → Actions.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
