name: Release

# Chỉ chạy khi có tag dạng v* được đẩy lên. Không tag = không phát hành.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # cần quyền này để tạo GitHub Release và upload file
  id-token: write # cosign ký không cần khoá; VÀ publish npm không cần token — cả hai dùng chung dòng này

# Hai tag đẩy lên sát nhau sẽ tranh nhau ghi vào repo tap/bucket. Xếp hàng thay vì
# huỷ job cũ: một bản phát hành đang dở mà bị huỷ giữa đường thì tệ hơn là chờ.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      # Tag Git đổi được, mã commit thì không. Vụ tj-actions/changed-files (03/2025)
      # là chuyện một tag bị đẩy lại trỏ sang code khác. Ghim theo mã commit đầy đủ.
      # Cập nhật bằng Dependabot, đừng sửa tay.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # GoReleaser cần toàn bộ history + tag để dựng changelog

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Ghim đủ ba số. "1.26" thả trôi số cuối, và runner bốc được bản nào thì
          # dùng bản đó: hai lần phát hành cách nhau 15 phút đã ra go1.26.8 rồi
          # go1.26.7, nên cùng một tag cho ra hai binary khác nhau. Điều đó phá đúng
          # câu "để CI build, để mọi bản phát hành đều tái tạo được" ở §9.
          # Nâng số này là một quyết định có chủ ý, không phải việc để mặc.
          go-version: "1.26.8"
          # Job phát hành không được nhận lại dữ liệu tạm mà một branch khác đã ghi:
          # nếu bộ nhớ tạm bị đầu độc thì checksums.txt và chữ ký cosign sẽ chứng thực
          # rất trung thực một binary đã hỏng. Đổi 1-2 phút lấy một chuỗi tin cậy sạch.
          cache: false

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Token này GitHub tự cấp, chỉ ghi được vào repo hiện tại.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token riêng để ghi sang repo homebrew-tap và scoop-bucket.
          # Tạo ở Settings → Developer settings → Personal access tokens,
          # rồi thêm vào repo này ở Settings → Secrets → Actions.
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

      # Chuyển dist/ sang job npm. KHÔNG dùng `gh release download`: bản tải về từ
      # Releases không có artifacts.json/metadata.json, nên job npm sẽ phải đọc tên
      # file mà cắt chuỗi — đúng cái HUONG-DAN-PHAT-HANH-CLI.md §1.1 cấm.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          # Job npm chờ người phê duyệt môi trường `release`. Để 1 ngày thì một lần
          # phê duyệt muộn làm artifact biến mất và job không chạy lại được nữa.
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # Kênh 7 — npm/npx. Job RIÊNG, không phải một bước trong job trên. Ba lý do:
  #   1. quyền publish npm không được có mặt trong bước đang giữ TAP_GITHUB_TOKEN;
  #   2. npm publish hỏng thì bản release đã lên vẫn nguyên, và chạy lại được RIÊNG;
  #   3. job trên cần Go, job này cần Node — trộn vào làm chậm mọi lần chạy.
  #
  # KHÔNG được tách job này ra một workflow dùng chung, và KHÔNG được cho chạy tay:
  # cơ chế publish không cần token của npm kiểm TÊN FILE workflow, nên cả hai cách
  # đó làm nó không nhận. Đây là bẫy khi dọn code — cùng loại với comment ở
  # .goreleaser.yaml:34-35 ("Tên file này là hợp đồng giữa 4 kênh").
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest # cơ chế publish không cần token CHỈ chạy trên máy ảo của GitHub
    # Bỏ qua bản thử nghiệm. Điều kiện này khớp đúng cách GoReleaser hiểu "bản thử
    # nghiệm" (.goreleaser.yaml:76 `prerelease: auto` = tag có dấu `-`). ĐỪNG đổi
    # thành tìm chữ "rc"/"beta": v0.2.0-alpha1 sẽ lọt lên nhãn latest trong khi
    # Homebrew và Scoop cố tình bỏ qua đúng tag đó.
    if: ${{ !contains(github.ref_name, '-') }}
    environment: release # bắt buộc có người phê duyệt, không cho tự phê duyệt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22" # >= 22.14.0, yêu cầu của publish không cần token
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: npm phải đủ mới cho publish không cần token
        run: |
          npm install -g npm@latest
          need=11.5.1
          have=$(npm --version)
          # Hỏng thì phải BÁO LỖI TO. Không bao giờ âm thầm publish bằng đường khác.
          [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" = "$need" ] || {
            echo "::error::npm $have < $need — publish không cần token sẽ không hoạt động"
            exit 1
          }
          echo "npm $have, node $(node --version)"

      # Bước 1 — dựng gói. Bảng mã băm phải suy ra từ checksums.txt ĐÃ CÓ CHỮ KÝ.
      # --require-signature biến "không có chữ ký" từ cảnh báo thành lỗi.
      - name: dựng 7 gói từ file nén đã ký
        run: |
          node npm/build-packages.js --require-signature
          node npm/verify.js

      # Bước 2 — cửa chặn chiếm tên và trùng số phiên bản.
      # Cửa này phải HỎNG ĐÓNG: chỉ 404 mới là "chưa có". Mọi mã khác (000 khi hỏng
      # DNS, 429, 5xx) nghĩa là "không biết", và một cửa chống trùng tên mà coi "không
      # biết" là "chưa có" thì chỉ còn là trang trí.
      - name: 7 tên ở số phiên bản này phải chưa tồn tại
        run: |
          v=$(node -p "require('./dist/npm/hellopay/package.json').version")
          names="hellopay $(node -p "Object.keys(require('./dist/npm/hellopay/package.json').optionalDependencies).join(' ')")"
          fail=0
          for name in $names; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
              --max-time 30 "https://registry.npmjs.org/$name/$v")
            case "$code" in
              404) ;;
              200)
                echo "::error::$name@$v đã tồn tại. KHÔNG xoá gói: tăng số phiên bản, dán tag mới, chạy lại từ đầu (§5.9.6)"
                fail=1 ;;
              *)
                echo "::error::không hỏi được kho gói về $name@$v (HTTP $code). Dừng, không đoán là chưa có"
                fail=1 ;;
            esac
          done
          exit $fail

      - name: chạy thử publish cả 7
        run: |
          for d in dist/npm/*/; do (cd "$d" && npm publish --dry-run --access public); done

      # Bước 3 — 6 gói nền tảng lên trước.
      # Nhãn `latest` của CHÚNG không mang ý nghĩa gì: không ai cài chúng trực tiếp, và
      # gói bọc ghim số phiên bản CHÍNH XÁC nên nhãn không tham gia vào việc phân giải.
      # Nhãn duy nhất có ý nghĩa là nhãn của GÓI BỌC, và gói bọc lên cuối cùng, bước 6.
      #
      # Cố ý KHÔNG có `npm dist-tag` ở bất kỳ đâu trong job này. Cơ chế publish không
      # cần token đổi OIDC lấy token BÊN TRONG một lần `npm publish`, và token đó chỉ
      # sống trong bộ nhớ của đúng tiến trình ấy (`config.set(..., 'user')` ở
      # lib/utils/oidc.js của npm, không có lời gọi save nào). Một lệnh `npm dist-tag`
      # riêng là tiến trình mới, không có gì để xác thực, và chết với E401. Cách duy
      # nhất làm nó chạy là cất một mật khẩu vào GitHub — đúng thứ cơ chế này tồn tại
      # để loại bỏ.
      - name: publish 6 gói nền tảng
        run: |
          for d in dist/npm/cli-*/; do (cd "$d" && npm publish --access public --provenance); done

      # Bước 4 — CỬA QUAN TRỌNG NHẤT. Tải LẠI 6 gói TỪ KHO GÓI (không lấy từ dist/ trên
      # máy), băm lại binary bên trong, so với bảng trong gói bọc CHƯA publish.
      - name: tải lại từ kho gói và so mã băm
        run: node npm/verify-published.js --max-wait 600

      # Bước 5 — cài thử ĐÚNG file gói bọc sắp publish, trong một project sạch, với 6
      # gói nền tảng lấy từ kho gói thật. Chạy TRƯỚC khi publish gói bọc, nên hỏng ở
      # đây thì chưa có gì trỏ vào bản này. Đây là chỗ cơ chế so mã băm chạy thật.
      - name: cài thử gói bọc trước khi publish
        run: |
          v=$(node -p "require('./dist/npm/hellopay/package.json').version")
          name=$(cd dist/npm/hellopay && npm pack --silent)
          tgz="$PWD/dist/npm/hellopay/$name"
          t=$(mktemp -d) && cd "$t" && npm init -y >/dev/null
          npm install --ignore-scripts "$tgz"
          out=$(./node_modules/.bin/hellopay version)
          echo "$out"
          echo "$out" | grep -q "$v" || { echo "::error::bản cài về không phải $v"; exit 1; }

      # Bước 6 — HÀNH ĐỘNG PHÁT HÀNH. Một lệnh, và là lệnh cuối cùng: từ giây này
      # `npx hellopay` trỏ vào bản mới. Mọi cửa đã qua trước khi tới đây.
      - name: publish gói bọc
        run: cd dist/npm/hellopay && npm publish --access public --provenance
