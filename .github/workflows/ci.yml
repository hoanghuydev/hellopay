name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd)
          test -z "$out" || { echo "gofmt needed on:"; echo "$out"; exit 1; }

      - run: go vet ./...
      - run: go build ./...

  # Chạy ở đây để một .goreleaser.yaml sai bị phát hiện lúc pull request, chứ
  # không phải lúc đã đẩy tag lên — tag thì không rút lại được cho gọn.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # Dựng thử toàn bộ bản phát hành nhưng không upload gì. Bắt được các lỗi chỉ
  # xuất hiện khi build đủ 6 nền tảng, ví dụ template tên file sai.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=sign

  # Hai script cai chay tren may nguoi khac, nen mot loi cu phap la mot lan cai
  # that bai cua khach hang, khong phai mot build do.
  install-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck install.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh install.sh

      - name: parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            exit 1
          }

      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          # Ghim ban: PSScriptAnalyzer moi doi PowerShell >= 7.4.6, runner khong
          # luon co, va loi bao ra rat kho hieu.
          Install-Module PSScriptAnalyzer -RequiredVersion 1.22.0 -Force -Scope CurrentUser -SkipPublisherCheck
          # PSAvoidUsingWriteHost bi loai tru co y: installer in ra console cho
          # nguoi doc, khong sinh object cho pipeline.
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          if ($found) {
            $found | Format-Table RuleName,Line,Message -AutoSize -Wrap | Out-String -Width 160 | Write-Host
            exit 1
          }
