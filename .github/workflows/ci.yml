name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: gofmt
        run: |
          out=$(gofmt -l ./cmd)
          test -z "$out" || { echo "gofmt needed on:"; echo "$out"; exit 1; }

      - run: go vet ./...
      - run: go build ./...

  # Chạy ở đây để một .goreleaser.yaml sai bị phát hiện lúc pull request, chứ
  # không phải lúc đã đẩy tag lên — tag thì không rút lại được cho gọn.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  # Dựng thử toàn bộ bản phát hành nhưng không upload gì. Bắt được các lỗi chỉ
  # xuất hiện khi build đủ 6 nền tảng, ví dụ template tên file sai.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --snapshot --skip=sign
